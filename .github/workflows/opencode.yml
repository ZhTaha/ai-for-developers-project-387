name: opencode

# Интерактивный вызов агента: команда в комментарии к issue или к строке diff в PR.
# types: [created] — только созданный комментарий, правка не запускает повторный прогон.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Ограничение параллельных запусков по номеру issue/PR:
# новый прогон пользователя отменяет текущий (cancel-in-progress).
# Тип автора в группе: комментарий самого агента (бот) не отменяет прогон,
# который его породил, — у бота отдельная группа.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.user.type }}
  cancel-in-progress: true

jobs:
  opencode:
    # Фильтр до работы агента: команда в тексте + доверенный автор + не бот.
    # Боты (в том числе сам агент) игнорируются, чтобы не отвечать на свои сообщения.
    # Недоверенные авторы (включая форки) не доходят до шагов и не получают ключ модели.
    if: |
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Стандартная авторизация OpenCode: чтение репозитория + OIDC-токен для GitHub App.
    # Агент действует правами приложения; push выполняется токеном приложения.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Токен checkout не сохраняется — push делает GitHub App, не GITHUB_TOKEN.
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ модели только из Secrets репозитория, не в тексте воркфлоу.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          # Набор команд по умолчанию, задан явно (см. README.md).
          mentions: /opencode,/oc
          # Решение для публичного репозитория: сессии агента не публикуем (см. README.md).
          share: "false"
